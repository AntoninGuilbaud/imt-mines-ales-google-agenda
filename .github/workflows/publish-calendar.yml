name: Publish personal calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate ICS
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          PLANNING_USERNAME: ${{ secrets.PLANNING_USERNAME }}
          PLANNING_PASSWORD: ${{ secrets.PLANNING_PASSWORD }}
          STUDENT_ID: "20432"
          SCHOOL_BASE_URL: https://webdfd.mines-ales.fr/planning-eleves
          ICS_OUTPUT: site/calendar.ics
        run: |
          mkdir -p site
          npm run generate:live
          printf '%s\n' 'Calendrier personnel IMT Mines Alès' > site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
